<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" role="img" aria-labelledby="title desc"><title id="title">1971 first microprocessor</title><desc id="desc">A glowing early microprocessor at the center of a copper circuit board.</desc><defs><radialGradient id="bg"><stop stop-color="#517783"/><stop offset="1" stop-color="#062b49"/></radialGradient><linearGradient id="chip"><stop stop-color="#f1eee5"/><stop offset="1" stop-color="#aac6b9"/></linearGradient></defs><rect width="500" height="200" fill="url(#bg)"/><g stroke="#ff7300" stroke-width="3" opacity=".7"><path d="M0 25h100l35 35h78M0 175h100l35-35h78M500 25h-100l-35 35h-78M500 175h-100l-35-35h-78"/><path d="M50 0v50M120 0v35M380 0v35M450 0v50M50 200v-50M120 200v-35M380 200v-35M450 200v-50"/></g><rect x="175" y="35" width="150" height="130" rx="8" fill="#0a1413" stroke="#00c7fd" stroke-width="5" transform="rotate(-4 250 100)"/><rect x="195" y="55" width="110" height="90" fill="url(#chip)" transform="rotate(-4 250 100)"/><g stroke="#ff7300" stroke-width="5"><path d="M195 74h-40M195 100h-55M195 126h-40M305 74h40M305 100h55M305 126h40"/></g><text x="213" y="96" fill="#062b49" font-family="monospace" font-size="15">4004</text><text x="210" y="119" fill="#062b49" font-family="monospace" font-size="9">FIRST INSIDE</text><text x="21" y="30" fill="#f1eee5" font-family="monospace" font-size="15" letter-spacing="2">MICROPROCESSOR</text></svg>